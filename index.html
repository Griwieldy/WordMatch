<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<meta name="description" content="WordMatch — личный словарь английского, тематические модули и игры.">
<title>WordMatch</title>

<style>
:root {
  --bg: #f7f7f5;
  --surface: #fff;
  --ink: #20211f;
  --muted: #777a73;
  --border: #e6e7e2;
  --soft: #eeefea;
  --good: #3a6b26;
  --bad: #b33232;
  --shadow: 0 16px 50px #00000005;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #141613;
  --surface: #1c1f1b;
  --ink: #f1f2eb;
  --muted: #a4a89e;
  --border: #34392f;
  --soft: #282d25;
  --good: #b4d794;
  --bad: #f39b9b;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
}
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #91b45f;
  outline-offset: 3px;
}
a { color: inherit; text-decoration: none; }
input, select { min-width: 0; }
h1, h2, h3, p { margin: 0; }
h1 {
  font-size: clamp(30px, 3.3vw, 43px);
  font-weight: 700;
  letter-spacing: -1.8px;
  line-height: 1.24;
}
h2 { font-size: 22px; letter-spacing: -.7px; }
h3 { font-size: 16px; line-height: 1.4; }
small { font-size: 12px; }
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 34px 22px 25px;
  position: fixed;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.8px;
  margin: 0 8px 65px;
}
.brand-mark {
  height: 39px;
  width: 39px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--surface);
  border-radius: 11px;
  font-size: 24px;
  letter-spacing: -2px;
}
.brand-dot {
  font-size: 9px;
  vertical-align: top;
  margin-left: 2px;
  position: relative;
  top: 3px;
}
.sidebar-label, .mini-label, .eyebrow,
.field-label, .metric-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.sidebar-label {
  color: var(--muted);
  padding: 0 15px;
  margin-bottom: 14px;
}
nav { display: grid; gap: 7px; }
.nav-link {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 15px;
  border-radius: 9px;
  color: var(--muted);
  font-weight: 500;
  transition: background .15s;
}
.nav-link:hover { background: var(--soft); color: var(--ink); }
.nav-link.active { background: var(--ink); color: var(--surface); }
.nav-count {
  margin-left: auto;
  min-width: 25px;
  text-align: center;
  border-radius: 5px;
  background: #8882;
  font-size: 11px;
}
.nav-link.active .nav-count { background: #fff2; }
.sidebar-bottom { margin-top: auto; padding: 50px 14px 0; }
.mini-label { font-size: 9px; letter-spacing: 1.3px; }
.sidebar-bottom p {
  color: var(--muted);
  font-size: 12px;
  margin-top: 9px;
  max-width: 150px;
}
.sidebar-rule {
  height: 1px;
  background: var(--border);
  margin: 24px 0 18px;
}
.version { font-size: 9px; letter-spacing: 1px; color: var(--muted); }
.workspace {
  margin-left: 240px;
  min-width: 0;
  width: calc(100% - 240px);
}
.topbar {
  height: 89px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
}
.breadcrumb {
  display: flex;
  gap: 15px;
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 600;
}
.breadcrumb > span:first-child { color: var(--muted); }
.slash { color: #bbb; }
.top-actions { display: flex; gap: 20px; align-items: center; }
.plain-button, .icon-button { background: none; border: none; }
.plain-button {
  font-size: 11px;
  font-weight: 700;
  display: flex;
  gap: 12px;
  align-items: center;
}
.icon-button {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
}
.icon-button:hover { background: var(--soft); }
.avatar {
  width: 34px;
  height: 34px;
  background: var(--soft);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  border-radius: 50%;
}
main {
  max-width: 1250px;
  margin: 0 auto;
  padding: 44px 48px 55px;
  min-height: calc(100vh - 157px);
  outline: none;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}
.eyebrow {
  color: var(--muted);
  margin-bottom: 12px;
  font-size: 9px;
  letter-spacing: 2px;
}
.subtitle { color: var(--muted); margin-top: 10px; font-size: 13px; }
.date-pill {
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 11px;
  color: var(--muted);
  padding: 8px 12px;
  white-space: nowrap;
  display: flex;
  gap: 8px;
  align-items: center;
}
.hero {
  background: #242721;
  color: #f8f9f3;
  border-radius: 15px;
  min-height: 255px;
  padding: 34px 36px;
  display: flex;
  position: relative;
  overflow: hidden;
  justify-content: space-between;
  gap: 20px;
}
.hero-copy { z-index: 1; max-width: 380px; }
.hero .eyebrow { color: #b4b9a9; margin-bottom: 15px; }
.hero h2 {
  font-size: 31px;
  line-height: 1.25;
  letter-spacing: -1px;
  font-weight: 600;
}
.hero p {
  font-size: 12px;
  color: #bdc3b6;
  margin: 13px 0 24px;
  max-width: 300px;
}
.hero .primary { background: #e4edcc; color: #242721; }
.hero-art {
  width: 220px;
  flex-shrink: 0;
  position: relative;
  align-self: stretch;
  margin: 0 30px;
}
.flashcard {
  position: absolute;
  border: 1px solid #5d6452;
  border-radius: 12px;
  width: 156px;
  height: 180px;
  top: 8px;
  left: 25px;
  padding: 19px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 10px 30px #0002;
}
.flashcard.back {
  transform: rotate(-16deg);
  background: #3b4232;
  left: 4px;
  top: 20px;
}
.flashcard.front {
  transform: rotate(12deg);
  background: #e4e9d8;
  color: #2a3022;
  top: 7px;
  left: 55px;
  border-color: #e4e9d8;
}
.flashcard small { font-size: 8px; letter-spacing: 1.5px; opacity: .65; }
.flashcard strong { font-size: 25px; letter-spacing: -1px; }
.flashcard em { font-style: normal; font-size: 12px; opacity: .7; }
.flashcard .star { font-size: 26px; line-height: 1; }
.hero-line {
  position: absolute;
  right: -55px;
  top: -110px;
  height: 450px;
  width: 450px;
  border-radius: 50%;
  border: 1px solid #5d645244;
  box-shadow: 0 0 0 35px #5d645211, 0 0 0 70px #5d645211;
}
.primary, .secondary, .danger {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--surface);
  border-radius: 8px;
  padding: 11px 18px;
  font-weight: 500;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 42px;
  transition: transform .15s, opacity .15s;
}
.primary:hover, .secondary:hover { transform: translateY(-1px); }
.secondary {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--border);
}
.danger {
  background: var(--surface);
  color: var(--bad);
  border-color: var(--border);
}
.text-button {
  border: 0;
  background: none;
  padding: 5px 0;
  font-size: 12px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
}
.text-button:hover { text-decoration: underline; }
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin: 22px 0 32px;
}
.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.metric-top {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  margin-bottom: 13px;
}
.metric-label { font-size: 9px; letter-spacing: .9px; align-self: center; }
.metric-value {
  font-size: 30px;
  line-height: 1.15;
  letter-spacing: -1px;
  font-weight: 600;
}
.metric-detail { font-size: 10px; color: var(--muted); margin-top: 7px; }
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 28px 0 17px;
}
.section-heading h2 { font-size: 19px; }
.section-heading p { font-size: 11px; color: var(--muted); margin-top: 4px; }
.module-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 17px;
}
.module-card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.module-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px #00000008;
}
.module-art {
  height: 130px;
  background: var(--soft);
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.module-art.daily { background: #eeeae0; color: #777363; }
.module-art.travel { background: #e7eae3; color: #707b67; }
.module-art.technology { background: #e5e8e9; color: #69767b; }
.art-number {
  position: absolute;
  left: 17px;
  top: 13px;
  font-size: 9px;
  letter-spacing: 1px;
  opacity: .7;
}
.art-tag {
  position: absolute;
  right: 13px;
  top: 12px;
  background: #ffffff9c;
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 8px;
  letter-spacing: 1px;
  color: #55594e;
}
.module-art > svg {
  width: 76px;
  height: 76px;
  stroke-width: 1.1;
  transform: rotate(-9deg);
  z-index: 1;
}
.art-orbit {
  position: absolute;
  width: 145px;
  height: 145px;
  border: 1px solid currentColor;
  border-radius: 50%;
  opacity: .12;
  right: 20px;
  top: 35px;
}
.module-content { padding: 19px; }
.module-content h3 { font-size: 14px; min-height: 40px; }
.module-content p {
  font-size: 11px;
  color: var(--muted);
  margin: 5px 0 16px;
  min-height: 34px;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--muted);
  margin: 10px 0 7px;
}
.progress-track {
  height: 4px;
  background: var(--soft);
  border-radius: 5px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--ink);
  border-radius: 5px;
  transition: width .25s;
}
.module-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  padding-top: 15px;
  margin-top: 17px;
  font-size: 10px;
  color: var(--muted);
}
.module-bottom .text-button { font-size: 11px; }
.bottom-note {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 30px;
}
footer {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 22px 48px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 10px;
}
footer > span:first-child { font-weight: 700; color: var(--ink); }
footer > span:last-child { font-size: 9px; letter-spacing: 1px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 19px;
  flex-wrap: wrap;
}
.search { flex: 1; min-width: 190px; position: relative; }
.search > svg {
  position: absolute;
  top: 15px;
  left: 14px;
  color: var(--muted);
}
.search input { padding-left: 42px; }
.field {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  padding: 12px 14px;
  min-height: 46px;
}
.field:focus { border-color: var(--ink); }
.field::placeholder { color: var(--muted); font-size: 12px; }
.field-label {
  display: block;
  font-size: 9px;
  letter-spacing: 1.1px;
  margin-bottom: 8px;
  color: var(--muted);
}
.field-group { margin-bottom: 21px; }
.field-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
.field-error {
  font-size: 11px;
  color: var(--bad);
  margin-top: 6px;
  min-height: 16px;
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  font-size: 11px;
  padding: 7px 11px;
}
.chip.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.small-muted { font-size: 11px; color: var(--muted); }
.word-list {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
}
.word-row {
  display: grid;
  grid-template-columns: 38px 1fr 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 17px 22px;
  border-bottom: 1px solid var(--border);
}
.word-row:last-child { border-bottom: 0; }
.word-number { color: var(--muted); font-size: 10px; font-family: monospace; }
.word-english { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.word-translation { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.word-folder { font-size: 10px; color: var(--muted); margin-top: 3px; }
.word-actions { display: flex; gap: 4px; align-items: center; }
.word-actions .icon-button { height: 32px; width: 32px; }
.row-saved {
  font-size: 10px;
  color: var(--good);
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 7px;
}
.empty {
  padding: 55px 24px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: 12px;
  color: var(--muted);
  background: var(--surface);
}
.empty > svg { margin-bottom: 16px; }
.empty h3 { color: var(--ink); margin-bottom: 8px; }
.empty p { font-size: 12px; max-width: 350px; margin: 0 auto 20px; }
.form-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
.form-side {
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--soft);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.form-side .big-letter {
  font-size: 110px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -9px;
}
.form-side p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 18px;
  max-width: 260px;
}
.form-actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
.game-setup { max-width: 720px; margin: 0 auto; }
.option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-option {
  padding: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 9px;
  text-align: left;
}
.mode-option.active {
  border: 2px solid var(--ink);
  padding: 19px;
  background: var(--soft);
}
.mode-option > svg { margin-bottom: 15px; }
.mode-option strong { display: block; font-weight: 600; font-size: 14px; }
.mode-option p { font-size: 11px; color: var(--muted); margin-top: 6px; }
.size-options { display: flex; gap: 10px; }
.size-options .chip { flex: 1; padding: 12px; }
.setup-section { margin: 26px 0; }
.full-width { width: 100%; }
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 12px;
}
.game-status { font-size: 12px; color: var(--muted); display: flex; gap: 20px; }
.match-board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  max-width: 820px;
  margin: 24px auto;
}
.match-column { display: grid; gap: 10px; align-content: start; }
.match-card {
  padding: 15px 18px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  text-align: left;
  min-height: 57px;
  font-size: 14px;
  transition: background .15s, transform .15s;
  overflow-wrap: anywhere;
}
.match-card:hover:enabled { transform: translateY(-1px); border-color: var(--muted); }
.match-card.selected { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.match-card.found { opacity: .32; border-style: dashed; background: var(--soft); }
.feedback {
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--soft);
  font-size: 12px;
  text-align: center;
  min-height: 44px;
}
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.writing-card {
  max-width: 570px;
  margin: 30px auto;
  text-align: center;
  padding: 40px;
}
.writing-card h2 { font-size: 43px; margin: 20px 0 14px; overflow-wrap: anywhere; }
.writing-card .field { text-align: center; font-size: 18px; margin: 23px 0 0; }
.writing-card .form-actions { justify-content: center; margin-top: 20px; }
.result { text-align: center; max-width: 600px; margin: 45px auto; }
.result-symbol {
  width: 78px;
  height: 78px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--soft);
  margin: 0 auto 22px;
}
.result h1 { margin-bottom: 12px; }
.result .metrics { grid-template-columns: 1fr 1fr; text-align: left; }
.result .form-actions { justify-content: center; }
.stats-split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.mode-stats { margin-top: 18px; display: grid; gap: 13px; }
.stat-line { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.stat-line strong { color: var(--ink); }
.stats-info { font-size: 12px; color: var(--muted); line-height: 1.8; }
.stats-info p + p { margin-top: 10px; }
.stats-reset {
  margin-top: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  border-top: 1px solid var(--border);
  padding-top: 24px;
}
dialog {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0;
  width: min(460px, calc(100% - 32px));
  max-height: 85vh;
  box-shadow: 0 28px 120px #0003;
}
dialog::backdrop { background: #13180f77; backdrop-filter: blur(5px); }
.dialog-body { padding: 30px; }
.dialog-body h2 { font-size: 23px; margin-bottom: 12px; }
.dialog-body > p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.dialog-body .form-actions { margin-top: 24px; }
.language-options { display: grid; gap: 12px; }
.language-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 17px;
  text-align: left;
}
.language-option:hover { background: var(--soft); }
.language-option strong { display: block; font-size: 16px; }
.language-option small { color: var(--muted); }
#toast {
  position: fixed;
  bottom: 28px;
  left: calc(50% + 120px);
  transform: translate(-50%, 15px);
  padding: 12px 20px;
  background: var(--ink);
  color: var(--surface);
  border-radius: 10px;
  box-shadow: 0 8px 25px #0002;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: .2s;
  max-width: 90vw;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.storage-warning {

'use strict';

/* =========================================================
   МОДУЛИ: 3 темы × 100 слов.
   Формат строки: английский|русский|румынский
   ========================================================= */

function topic(id, ru, ro, descriptionRu, descriptionRo, text) {
  const words = text.trim().split('\n').map((line, index) => {
    const [english, ru, ro] = line.trim().split('|');
    return { id: id + '_' + index, english, ru, ro };
  });

  if (words.length !== 100) {
    throw new Error('В модуле должно быть 100 слов: ' + id);
  }

  return {
    id,
    name: { ru, ro },
    description: { ru: descriptionRu, ro: descriptionRo },
    words
  };
}

try {
  const raw = localStorage.getItem(KEY);

  if (raw) {
    const saved = JSON.parse(raw);

    if (
      saved.version !== 1 ||
      !Array.isArray(saved.words) ||
      !Array.isArray(saved.folders) ||
      !saved.stats ||
      !Array.isArray(saved.stats.practicedWords)
    ) {
      throw new Error('Invalid saved data');
    }

    if (!saved.words.every(word =>
      typeof word.id === 'string' &&
      typeof word.english === 'string' &&
      typeof word.translation === 'string' &&
      ['ru', 'ro'].includes(word.language)
    )) {
      throw new Error('Invalid vocabulary');
    }

    if (!saved.folders.every(folder =>
      typeof folder.id === 'string' &&
      typeof folder.name === 'string'
    )) {
      throw new Error('Invalid folders');
    }

    for (const key of Object.keys(freshStats())) {
      if (
        key !== 'practicedWords' &&
        (!Number.isFinite(saved.stats[key]) || saved.stats[key] < 0)
      ) {
        throw new Error('Invalid statistics');
      }
    }

    state = saved;
  }
} catch (error) {
  storageBlocked = true;
}

function uid() {
  return globalThis.crypto?.randomUUID?.() ||
    'w' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function normal(text) {
  return text.trim().toLowerCase().normalize('NFC');
}

function normalize(text) {
  return normal(text)
    .replace(/ё/g, 'е')
    .replace(/ş/g, 'ș')
    .replace(/ţ/g, 'ț')
    .replace(/\bip\b/g, state.language === 'ru' ? 'айпи' : 'ip')
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

function accepts(answer, expected) {
  const candidate = normalize(answer);
  const withoutNotes = expected.replace(/\([^)]*\)/g, ' ');

  return Boolean(candidate) && [
    expected,
    withoutNotes,
    ...withoutNotes.split(/[;/]/)
  ].some(variant => normalize(variant) === candidate);
}

function nativeAllowed(value) {
  return [...value.normalize('NFC')].every(character => {
    if (!/\p{L}/u.test(character)) return true;

    return state.language === 'ro'
      ? /[a-zăâîșțşţ]/i.test(character)
      : /[а-яё]/i.test(character);
  });
}

function storageWarning() {
  const element = document.querySelector('#storage-warning');
  element.hidden = !storageBlocked;

  element.textContent = storageChangedInAnotherTab

    : t(

        'Salvarea nu este disponibilă. Modificările sunt blocate pentru protejarea datelor. Verifică setările de stocare ale browserului.'
      );
}

function saveState(next) {
  if (storageBlocked) {
    toast(t(
      'Изменения не сохранены. Хранилище недоступно.',
      'Modificările nu au fost salvate. Stocarea nu este disponibilă.'
    ));
    return false;
  }

  try {
    localStorage.setItem(KEY, JSON.stringify(next));
    state = next;
    return true;
  } catch (error) {
    storageBlocked = true;
    storageWarning();

    toast(t(
      'Не удалось сохранить. Проверь свободное место и настройки браузера.',
      'Salvarea a eșuat. Verifică spațiul liber și setările browserului.'
    ));

    return false;
  }
}

function toast(message) {
  const element = document.querySelector('#toast');
  element.textContent = message;
  element.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    element.classList.remove('show');
  }, 3400);
}

function visibleWords() {
  return state.words.filter(word =>
    word.language === (state.language || 'ru')
  );
}

function folderName(id) {
  if (!id) return tr('noFolder');

  const module = MODULES.find(module => 'module_' + module.id === id);

  if (module) return module.name[state.language || 'ru'];

  return state.folders.find(folder => folder.id === id)?.name ||
    tr('noFolder');
}

function moduleWords(module) {
  const language = state.language || 'ru';

  return module.words.map(word => ({
    id: language + '_' + word.id,
    english: word.english,
    translation: word[language],
    language,
    folderId: 'module_' + module.id
  }));
}

function sameWord(first, second) {
  return first.language === second.language &&
    normal(first.english) === normal(second.english) &&
    normal(first.translation) === normal(second.translation);
}

function isSaved(word) {
  return state.words.some(saved => sameWord(saved, word));
}

function moduleProgress(module) {
  return moduleWords(module).filter(isSaved).length;
}

function learnWord(word, moduleId) {
  if (isSaved(word)) return true;

  const folderId = 'module_' + moduleId;
  const module = MODULES.find(module => module.id === moduleId);

  const folders = state.folders.some(folder => folder.id === folderId)
    ? state.folders
    : [
        ...state.folders,
        { id: folderId, name: module.name[state.language || 'ru'] }
      ];

  return saveState({
    ...state,
    folders,
    words: [
      ...state.words,
      { ...word, id: uid(), folderId }
    ]
  });
}

function speak(text) {
  if (!text.trim()) return;

  if (!('speechSynthesis' in window)) {
    toast(t(
      'Этот браузер не поддерживает озвучку.',
      'Acest browser nu acceptă sinteza vocală.'
    ));
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = .85;

  const voices = speechSynthesis.getVoices();
  const voice = voices.find(voice => voice.lang === 'en-US') ||
    voices.find(voice => voice.lang.startsWith('en'));

  if (voice) utterance.voice = voice;

  utterance.onerror = event => {
    if (!['interrupted', 'canceled'].includes(event.error)) {
      toast(t(
        'Английский голос недоступен. Проверь настройки браузера.',
        'Vocea engleză nu este disponibilă. Verifică setările browserului.'
      ));
    }
  };

  speechSynthesis.speak(utterance);
}

/* =========================================================
   ЛОГИКА ИГР
   ========================================================= */

function shuffle(list) {
  const result = [...list];

  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }

  return result;
}

/*
  Перемешивание без исходных позиций.
  Для двух и более карточек каждая карточка меняет место.
*/
function derange(list) {
  const result = [...list];

  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * index);
    [result[index], result[other]] = [result[other], result[index]];
  }

  return result;
}

function startRound(words = null, review = false) {
  const chosen = words || shuffle(pool()).slice(0, setup.size);

  if (!chosen.length || storageBlocked) return;

  const left = shuffle(chosen);

  session = {
    id: uid(),
    mode: setup.mode,
    words: chosen,
    left,
    right: derange(left),
    selectedLeft: null,
    selectedRight: null,
    foundLeft: [],
    foundRight: [],
    missed: [],
    errors: 0,
    attempts: 0,
    correct: 0,
    index: 0,
    answer: '',
    resolved: false,
    lastSubmission: null,
    wasCorrect: false,
    complete: false,
    review,
    moduleId: setup.source.startsWith('module:')
      ? setup.source.slice(7)
      : null,
    feedback: '',
    feedbackType: ''
  };

  render();
}

function recordAnswer(word, correct) {
  if (!session || storageBlocked) return false;

  const stats = {
    ...state.stats,
    practicedWords: [...state.stats.practicedWords]
  };

  stats.attempts++;
  stats[session.mode + 'Attempts']++;

  if (correct) {
    stats.correct++;
    stats[session.mode + 'Correct']++;
  }

  const key = normal(word.english) + '\u001f' + normal(word.translation);

  if (correct && !stats.practicedWords.includes(key)) {
    stats.practicedWords.push(key);
  }

  if (!saveState({ ...state, stats })) return false;

  session.attempts++;

  if (correct) {
    session.correct++;

    if (session.moduleId) {
      learnWord(word, session.moduleId);
    }
  } else {
    session.errors++;

    if (!session.missed.includes(word.id)) {
      session.missed.push(word.id);
    }
  }

  return true;
}

function finishRound() {
  if (!session || session.complete) return;

  const stats = { ...state.stats };
  stats[session.mode + 'Rounds']++;

  if (session.review) stats.reviewRounds++;

  if (saveState({ ...state, stats })) {
    session.complete = true;
  }
}

function pair() {
  const leftWord = session.left.find(word =>
    word.id === session.selectedLeft
  );

  const rightWord = session.right.find(word =>
    word.id === session.selectedRight
  );

  if (!leftWord || !rightWord) return;

  const correct =
    normal(leftWord.translation) === normal(rightWord.translation);

  if (!recordAnswer(leftWord, correct)) return;

  if (correct) {
    session.foundLeft.push(leftWord.id);
    session.foundRight.push(rightWord.id);

    session.feedback = t(
      'Верно! Ещё одно слово стало знакомым.',
      'Corect! Încă un cuvânt a devenit familiar.'
    );
    session.feedbackType = 'good';
  } else {
    session.feedback = t(
      'Эти слова не пара. Попробуй ещё раз.',
      'Aceste cuvinte nu formează o pereche. Încearcă din nou.'
    );
    session.feedbackType = 'bad';
  }

  session.selectedLeft = null;
  session.selectedRight = null;

  if (session.foundLeft.length === session.words.length) {
    finishRound();
  }

  render();
}

function submitAnswer(reveal = false) {
  if (!session || session.resolved) return;

  const word = session.words[session.index];
  const answer = session.answer.trim();

  if (!reveal && (
    !answer ||
    !nativeAllowed(answer) ||
    session.lastSubmission === normal(answer)
  )) {
    return;
  }

  const correct = !reveal && accepts(answer, word.translation);

  if (!recordAnswer(word, correct)) return;

  session.lastSubmission = normal(answer);
  session.feedbackType = correct ? 'good' : 'bad';

  if (correct || reveal) {
    session.resolved = true;
    session.wasCorrect = correct;
    session.feedback = correct
      ? t('Правильно!', 'Corect!')
      : t('Перевод: ', 'Traducere: ') + word.translation;
  } else {
    session.feedback = t(
      'Пока не совсем. Попробуй ещё раз или открой ответ.',
      'Nu chiar. Încearcă din nou sau vezi răspunsul.'
    );
  }

  render();
}

      <h2>${escapeHTML(word.english)}</h2>
      ${iconButton('sound', tr('listen'), 'speak', word.id)}

      <form id="answer-form">
        <input id="answer" class="field"
          placeholder="${t('Напиши перевод…', 'Scrie traducerea…')}"
          value="${escapeHTML(game.answer)}"
          data-native maxlength="200" autocomplete="off"
          aria-label="${tr('translation')}"
          ${game.resolved ? 'disabled' : ''}>

        <div class="field-error"
             data-error-for="answer" aria-live="polite"></div>

        <div class="form-actions">
          ${game.resolved
            ? button(
                `${
                  game.index === game.words.length - 1
                    ? t('Завершить раунд', 'Încheie runda')
                    : tr('next')
                }${svg('arrow')}`,
                'next',
                'primary'
              )
            : `
              <button class="primary" type="submit" id="check-answer"
                ${!game.answer.trim() ||
                  game.lastSubmission === normal(game.answer) ||
                  storageBlocked ? 'disabled' : ''}>
                ${tr('check')}${svg('check')}
              </button>

              ${button(
                t('Показать ответ', 'Arată răspunsul'),
                'reveal'
              )}
            `}
        </div>
      </form>

      ${game.feedback
        ? `<div class="feedback ${game.feedbackType}"
             style="margin-top:24px" role="status">
             ${escapeHTML(game.feedback)}
           </div>`
        : ''}
    </section>`;
}

/* =========================================================
   СТАТИСТИКА

function statistics() {
  const stats = state.stats;

  return heading(
    t('Твой прогресс в цифрах.', 'Progresul tău în cifre.'),
    t(
      'Каждый ответ — часть твоей истории обучения.',
      'Fiecare răspuns este o parte din povestea învățării tale.'
    )
  ) + metrics() + `
    <div class="stats-split">
      ${['match', 'write'].map(mode => `
        <section class="panel">
          <div class="section-heading" style="margin-top:0">
            <h3>${tr(mode)}</h3>
            ${svg(mode === 'match' ? 'cards' : 'edit')}
          </div>

          <div class="mode-stats">
            ${[
              [tr('attempts'), stats[mode + 'Attempts']],
              [tr('correct'), stats[mode + 'Correct']],
              [tr('errors'), stats[mode + 'Attempts'] - stats[mode + 'Correct']],
              [tr('rounds'), stats[mode + 'Rounds']]
            ].map(([label, value]) => `
              <div class="stat-line">
                <span>${label}</span><strong>${value}</strong>
              </div>
            `).join('')}
          </div>
        </section>
      `).join('')}
    </div>

    <section class="panel" style="margin-top:20px">
      <h3>${t('Как работает статистика', 'Cum funcționează statisticile')}</h3>

      <div class="stats-info" style="margin-top:15px">
        <p>${t(
          'Каждая проверенная пара или отправленный перевод — один ответ. Ошибка и исправленный ответ учитываются отдельно. Открытый ответ считается ошибкой.',
          'Fiecare pereche verificată sau traducere trimisă este un răspuns. O greșeală și răspunsul corectat se numără separat. Afișarea răspunsului se consideră greșeală.'
        )}</p>

        <p>${t(
          'Точность = верные ответы ÷ все ответы × 100%. Раунд засчитывается после прохождения всех слов. Статистика общая для русского и румынского языков.',
          'Precizia = răspunsuri corecte ÷ toate răspunsurile × 100%. Runda se numără după parcurgerea tuturor cuvintelor. Statisticile sunt comune pentru rusă și română.'
        )}</p>

        <p>
          ${t('Уникальных слов с верным ответом', 'Cuvinte unice cu răspuns corect')}:
          <strong>${stats.practicedWords.length}</strong>
          ·
          ${t('Раундов повторения ошибок', 'Runde de repetare a greșelilor')}:
          <strong>${stats.reviewRounds}</strong>
        </p>
      </div>

      <div class="stats-reset">
        <div>
          <h3>${t(
            'Начать отсчёт заново',
            'Începe numărătoarea de la zero'
          )}</h3>
          <p class="small-muted">${t(
            'Слова, папки и настройки сохранятся.',
            'Cuvintele, dosarele și setările se păstrează.'
          )}</p>
        </div>

        ${button(
          `${svg('trash')}${tr('reset')}`,
          'reset-stats',
          'danger'
        )}
      </div>
    </section>`;
}

/* =========================================================
   НАВИГАЦИЯ И ОТРИСОВКА
   ========================================================= */

function route() {
  const hash = location.hash.slice(1) || 'home';

  const allowed = [
    'home', 'vocabulary', 'modules', 'add', 'play', 'stats'
  ].includes(hash) || /^module\/(daily|travel|technology)$/.test(hash);

  return allowed ? hash : 'home';
}

function render() {
  const currentRoute = route();
  const navigationRoute = currentRoute.startsWith('module/')
    ? 'modules'
    : currentRoute;

  document.documentElement.lang = state.language || 'ru';
  document.documentElement.dataset.theme = state.theme;

  document.querySelector('meta[name="theme-color"]').content =
    state.theme === 'dark' ? '#141613' : '#f7f7f5';

  document.querySelectorAll('[data-i18n]').forEach(element => {
    element.textContent = tr(element.dataset.i18n);
  });

  document.querySelector('#navigation').innerHTML = [
    ['home', 'home'],
    ['vocabulary', 'book'],
    ['modules', 'grid'],
    ['play', 'play'],
    ['stats', 'chart']
  ].map(([key, icon]) => `
    <a class="nav-link ${navigationRoute === key ? 'active' : ''}"
       href="#${key}"
       ${navigationRoute === key ? 'aria-current="page"' : ''}>
      ${svg(icon)}
      <span class="nav-label">${tr(key)}</span>
      ${key === 'vocabulary'
        ? `<span class="nav-count">${visibleWords().length}</span>`
        : ''}
    </a>
  `).join('');

  document.querySelector('#page-label').textContent = tr(navigationRoute);

  document.querySelector('#language').innerHTML =
    (state.language || 'ru').toUpperCase() + ' <span>⌄</span>';

  document.querySelector('#footer-language').textContent =
    (state.language || 'ru').toUpperCase();

  document.querySelector('#theme').innerHTML =
    svg(state.theme === 'dark' ? 'sun' : 'moon');

  document.querySelector('#theme').setAttribute(
    'aria-label',
    state.theme === 'dark'
      ? t('Светлая тема', 'Temă luminoasă')
      : t('Тёмная тема', 'Temă întunecată')
  );

  storageWarning();

  const pages = {
    home,
    vocabulary,
    modules: modulesPage,
    add: addPage,
    play: gamePage,
    stats: statistics
  };

  main.innerHTML = currentRoute.startsWith('module/')
    ? modulePage(currentRoute.split('/')[1])
    : (pages[currentRoute] || home)();

  bindInputs(main);
}

function bindInputs(root) {
  const draftForm = root.querySelector('#word-form');

  if (draftForm && !draftForm.dataset.id) {
    draftForm.addEventListener('input', () => {
      addDraft = {
        english: draftForm.elements.english.value,
        translation: draftForm.elements.translation.value,
        folder: draftForm.elements.folder.value
      };
    });

    draftForm.addEventListener('change', () => {
      addDraft.folder = draftForm.elements.folder.value;
    });
  }

  root.querySelectorAll('[data-native]').forEach(input => {
    input.dataset.lastValid = input.value;

    input.addEventListener('input', () => {
      const error = root.querySelector(
        `[data-error-for="${input.id}"]`
      );

      if (!nativeAllowed(input.value)) {
        input.value = input.dataset.lastValid || '';
        if (error) error.textContent = nativeHint();
      } else {
        input.dataset.lastValid = input.value;
        if (error) error.textContent = '';
      }

      if (input.id === 'answer' && session) {
        session.answer = input.value;

        const check = document.querySelector('#check-answer');

        if (check) {
          check.disabled =
            !input.value.trim() ||
            session.lastSubmission === normal(input.value) ||
            storageBlocked;
        }
      }
    });
  });

  for (const id of ['vocabulary-search', 'module-search']) {
    const input = root.querySelector('#' + id);
    if (!input) continue;

    input.addEventListener('input', () => {
      const value = input.value;
      const position = input.selectionStart;

      if (id === 'vocabulary-search') {
        query = value;
      } else {
        moduleQuery = value;
      }

      render();

      const replacement = document.querySelector('#' + id);
      replacement.focus();

      try {
        replacement.setSelectionRange(position, position);
      } catch (error) {
        // Некоторые браузеры не поддерживают выделение в search.
      }
    });
  }

  root.querySelector('#game-source')?.addEventListener('change', event => {
    setup.source = event.target.value;
    render();
  });
}

  if (dialog.open) dialog.close();

  dialog.dataset.required = required ? 'true' : 'false';

  document.querySelector('#dialog-content').innerHTML =
    `<div class="dialog-body">${html}</div>`;

  bindInputs(dialog);
  dialog.showModal();
}

function closeDialog() {
  dialog.dataset.required = 'false';
  dialog.close();
}

  openDialog(`
    <h2>${escapeHTML(title)}</h2>
    <p>${message}</p>

}

function findWord(id) {
  return state.words.find(word => word.id === id) ||
    session?.words.find(word => word.id === id) ||
    MODULES.flatMap(moduleWords).find(word => word.id === id);
}

function changeLanguage(language) {
  if (!['ru', 'ro'].includes(language)) return;

  if (saveState({ ...state, language })) {
    firstLanguage = false;
    addDraft.translation = '';
    session = null;
    query = '';
    moduleQuery = '';
    filter = 'all';

    if ('speechSynthesis' in window) speechSynthesis.cancel();

    closeDialog();
    render();
  }
}

/* =========================================================
   ОБРАБОТКА КНОПОК
   ========================================================= */

function actionHandler(event) {
  const target = event.target.closest('[data-action]');
  if (!target || target.disabled) return;

  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'close-dialog') {
    closeDialog();
    return;
  }

  if (action === 'set-language') {
    if (state.language !== id && session && !session.complete) {
      confirmDialog(
        t('Изменить язык?', 'Schimbi limba?'),
        t(
          'Текущий раунд завершится. Сохранённые слова и результаты останутся.',
          'Runda curentă se va încheia. Cuvintele și rezultatele salvate rămân.'
        ),
        'confirm-language-' + id,
        t('Изменить язык', 'Schimbă limba')
      );
    } else {
      changeLanguage(id);
    }
    return;
  }

  if (action.startsWith('confirm-language-')) {
    changeLanguage(action.slice(17));
    return;
  }

  if (action === 'new-folder') {
    newFolderDialog();
    return;
  }

  if (action === 'speak') {
    const word = findWord(id);
    if (word) speak(word.english);
    return;
  }

  if (action === 'speak-draft') {
    const root = dialog.open ? dialog : main;
    const value = root.querySelector('#english')?.value.trim();

    if (value) {
      speak(value);
    } else {
      toast(t(
        'Сначала введи английское слово.',
        'Introdu mai întâi un cuvânt în engleză.'
      ));
    }
    return;
  }

  if (action === 'filter') {
    filter = id;
    render();
    return;
  }

  if (action === 'learn') {
    const module = MODULES.find(module =>
      module.id === target.dataset.module
    );

    const word = module &&
      moduleWords(module).find(word => word.id === id);

    if (word && learnWord(word, module.id)) {
      toast(t('Слово добавлено в словарь.', 'Cuvânt adăugat în vocabular.'));
      render();
    }
    return;
  }

  if (action === 'edit') {
    const word = state.words.find(word => word.id === id);

    if (word) {
      openDialog(`
        <h2>${t('Изменить слово', 'Editează cuvântul')}</h2>
        <p>${t(
          'Обнови слово, перевод или папку.',
          'Actualizează cuvântul, traducerea sau dosarul.'
        )}</p>
        ${wordForm(word)}
      `);
    }
    return;
  }

  if (action === 'move') {
    const word = state.words.find(word => word.id === id);

    if (word) {
      openDialog(`
        <h2>${tr('move')}</h2>
        <p>${escapeHTML(word.english)}</p>

        <form id="move-form" data-id="${escapeHTML(id)}">
          <label class="field-label" for="move-folder">
            ${t('Выбери папку', 'Alege dosarul')}
          </label>

          <select class="field" id="move-folder" name="folder">
            ${folderOptions(word.folderId)}
          </select>

          <div class="form-actions">
            ${button(tr('cancel'), 'close-dialog')}
            <button type="submit" class="primary">${tr('save')}</button>
          </div>
        </form>
      `);
    }
    return;
  }

  if (action === 'delete-word') {
    const word = state.words.find(word => word.id === id);

    if (word) {
      confirmDialog(
        t('Удалить слово?', 'Ștergi cuvântul?'),
        escapeHTML(word.english) + ' — ' + escapeHTML(word.translation),
        'confirm-delete-word'
      );
      dialog.dataset.word = id;
    }
    return;
  }

  if (action === 'confirm-delete-word') {
    if (saveState({
      ...state,
      words: state.words.filter(word => word.id !== dialog.dataset.word)
    })) {
      closeDialog();
      render();
      toast(t('Слово удалено.', 'Cuvânt șters.'));
    }
    return;
  }

  if (action === 'delete-folder') {
    confirmDialog(
      t('Удалить папку?', 'Ștergi dosarul?'),
      t(
        'Слова сохранятся и переместятся в «Без папки».',
        'Cuvintele se păstrează și se mută în „Fără dosar”.'
      ),
      'confirm-delete-folder'
    );
    dialog.dataset.folder = filter;
    return;
  }

  if (action === 'confirm-delete-folder') {
    const folderId = dialog.dataset.folder;

    if (saveState({
      ...state,
      folders: state.folders.filter(folder => folder.id !== folderId),
      words: state.words.map(word =>
        word.folderId === folderId ? { ...word, folderId: '' } : word
      )
    })) {
      filter = 'all';

      if (addDraft.folder === folderId) addDraft.folder = '';
      if (setup.source === 'folder:' + folderId) {
        setup.source = 'vocabulary';
      }

      closeDialog();
      render();
    }
    return;
  }

  if (action === 'module-play') {
    if (session && !session.complete) {
      confirmDialog(
        t('Перейти к новому модулю?', 'Treci la un modul nou?'),
        t(
          'Текущий раунд завершится. Проверенные ответы останутся в статистике.',
          'Runda curentă se va încheia. Răspunsurile verificate rămân în statistici.'
        ),
        'confirm-module-play',
        t('Продолжить', 'Continuă')
      );
      dialog.dataset.module = id;
    } else {
      setup.source = 'module:' + id;
      session = null;
      location.hash = 'play';
    }
    return;
  }

  if (action === 'confirm-module-play') {
    setup.source = 'module:' + dialog.dataset.module;
    session = null;
    closeDialog();
    location.hash = 'play';
    return;
  }

  if (action === 'mode') {
    setup.mode = id;
    render();
    return;
  }

  if (action === 'size') {
    setup.size = Number(id);
    render();
    return;
  }

  if (action === 'start') {
    startRound();
    return;
  }

  if (action === 'exit-game') {
    confirmDialog(
      t('Выйти из раунда?', 'Ieși din rundă?'),
      t(
        'Проверенные ответы сохранятся. Незаконченный раунд не засчитается.',
        'Răspunsurile verificate se păstrează. Runda neterminată nu se numără.'
      ),
      'confirm-exit',
      t('Выйти', 'Ieși')
    );
    return;
  }

  if (action === 'confirm-exit') {
    session = null;
    closeDialog();
    render();
    return;
  }

  if (action === 'pair-left' || action === 'pair-right') {
    if (!session || session.complete) return;

    const side = action === 'pair-left' ? 'Left' : 'Right';

    if (session['found' + side].includes(id)) return;

    session['selected' + side] = id;

    if (session.selectedLeft && session.selectedRight) {
      pair();
    } else {
      render();
    }
    return;
  }

  if (action === 'reveal') {
    submitAnswer(true);
    return;
  }

  if (action === 'next') {
    if (!session?.resolved) return;

    if (session.index === session.words.length - 1) {
      finishRound();
    } else {
      session.index++;
      session.answer = '';
      session.resolved = false;
      session.lastSubmission = null;
      session.feedback = '';
      session.feedbackType = '';
    }

    render();
    document.querySelector('#answer')?.focus();
    return;
  }

  if (action === 'review') {
    const words = session.words.filter(word =>
      session.missed.includes(word.id)
    );

    setup.mode = session.mode;

    if (session.moduleId) {
      setup.source = 'module:' + session.moduleId;
    }

    startRound(words, true);
    return;
  }

  if (action === 'new-round') {
    session = null;
    render();
    return;
  }

  if (action === 'reset-stats') {
    confirmDialog(
      t('Сбросить всю статистику?', 'Resetezi toate statisticile?'),
      t(
        'Счётчики ответов, ошибок и раундов будут обнулены. Текущая игра завершится. Слова, папки и настройки останутся. Отменить сброс нельзя.',
        'Contoarele de răspunsuri, greșeli și runde vor fi resetate. Jocul curent se va încheia. Cuvintele, dosarele și setările rămân. Resetarea nu poate fi anulată.'
      ),
      'confirm-reset',
      tr('reset')
    );
    return;
  }

  if (action === 'confirm-reset') {
    if (saveState({ ...state, stats: freshStats() })) {
      session = null;
      closeDialog();
      render();
      toast(t('Статистика сброшена.', 'Statisticile au fost resetate.'));
    }
    return;
  }
}

/* =========================================================
   ОБРАБОТКА ФОРМ
   ========================================================= */

function formHandler(event) {
  const form = event.target;

  if (!(form instanceof HTMLFormElement)) return;

  event.preventDefault();

  if (form.id === 'word-form') {
    const english = form.elements.english.value.trim();
    const translation = form.elements.translation.value.trim();
    const folderId = form.elements.folder.value;
    const id = form.dataset.id;

    if (!english || !translation) return;

    if (!nativeAllowed(translation)) {
      toast(nativeHint());
      return;
    }

    const word = {
      id: id || uid(),
      english,
      translation,
      folderId,
      language: state.language || 'ru'
    };

    if (state.words.some(saved =>
      saved.id !== id && sameWord(saved, word)
    )) {
      toast(t(
        'Это слово с таким переводом уже есть.',
        'Acest cuvânt cu această traducere există deja.'
      ));
      return;
    }

    const words = id
      ? state.words.map(saved => saved.id === id ? word : saved)
      : [...state.words, word];

    if (saveState({ ...state, words })) {
      if (!id) {
        addDraft = { english: '', translation: '', folder: folderId };
      }

      if (dialog.open) closeDialog();

      render();
      toast(t('Слово сохранено.', 'Cuvânt salvat.'));
    }
    return;
  }

  if (form.id === 'folder-form') {
    const name = form.querySelector('#folder-name').value.trim();

    if (!name || !nativeAllowed(name)) return;

    if (state.folders.some(folder =>
      normal(folderName(folder.id)) === normal(name)
    )) {
      toast(t(
        'Папка с таким названием уже есть.',
        'Un dosar cu acest nume există deja.'
      ));
      return;
    }

    const folder = { id: uid(), name };

    if (saveState({
      ...state,
      folders: [...state.folders, folder]
    })) {
      if (route() === 'add') addDraft.folder = folder.id;

      closeDialog();
      render();
      toast(t('Папка создана.', 'Dosar creat.'));
    }
    return;
  }

  if (form.id === 'move-form') {
    const folderId = form.elements.folder.value;

    if (saveState({
      ...state,
      words: state.words.map(word =>
        word.id === form.dataset.id ? { ...word, folderId } : word
      )
    })) {
      closeDialog();
      render();
    }
    return;
  }

  if (form.id === 'answer-form') {
    submitAnswer();
  }
}

/* =========================================================
   ЗАПУСК
   ========================================================= */

main.addEventListener('click', actionHandler);
dialog.addEventListener('click', actionHandler);

main.addEventListener('submit', formHandler);
dialog.addEventListener('submit', formHandler);

dialog.addEventListener('cancel', event => {
  if (dialog.dataset.required === 'true') {
    event.preventDefault();
  }
});

document.querySelector('#language').addEventListener(
  'click',
  languageDialog
);

document.querySelector('#theme').addEventListener('click', () => {
  const theme = state.theme === 'dark' ? 'light' : 'dark';

  if (saveState({ ...state, theme })) {
    render();
  }
});

window.addEventListener('hashchange', () => {
  moduleQuery = '';

  if (dialog.open && !firstLanguage) {
    closeDialog();
  }

  render();
  window.scrollTo(0, 0);
});

window.addEventListener('storage', event => {
  if (event.key === KEY || event.key === null) {
    storageBlocked = true;
    storageChangedInAnotherTab = true;
    render();
  }
});

render();

if (firstLanguage) {
  languageDialog();
}
</script>
</body>
</html>
